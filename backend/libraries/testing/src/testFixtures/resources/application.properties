spring.profiles.active=test
spring.modulith.detection-strategy=explicitly-annotated
spring.flyway.schemas=shared,iam,authoring,releases,hosting
spring.modulith.events.completion-mode=archive
spring.modulith.events.jdbc.schema=shared
spring.modulith.events.jdbc.schema-initialization.enabled=false
mybatis.configuration.map-underscore-to-camel-case=true
io.space.session.allow-ephemeral-key=true
io.space.idempotency.allow-ephemeral-key=true
io.space.mail-outbox.allow-ephemeral-key=true
io.space.dns.resolver=fake
io.space.operations.scheduling-enabled=false
spring.mail.host=localhost
spring.mail.port=1025
