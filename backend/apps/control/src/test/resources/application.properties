spring.profiles.active=test
spring.modulith.detection-strategy=explicitly-annotated
# 测试用确定性临时密钥（种子固定在 SessionCredentialConfiguration），生产必须给 PEM
io.edition.session.allow-ephemeral-key=true
# 测试显式允许临时幂等响应加密密钥；生产缺 IDEMPOTENCY_ENCRYPTION_KEY 必须拒绝启动
io.edition.idempotency.allow-ephemeral-key=true
io.edition.mail-outbox.allow-ephemeral-key=true
# RLS 与生产同构：全套测试都以受限角色 space_app 连库（issue 29 验收要求）。
# 需要跨租户铺 fixture 的测试用 migrationDataSource（owner 身份），不得关闭本开关。
io.edition.rls.enabled=true
io.edition.dns.resolver=fake

io.edition.operations.scheduling-enabled=false
