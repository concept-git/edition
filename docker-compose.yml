# 本机依赖，供手动诊断。依赖容器独立启动，也不用于生产。
# 完整平台：node infra/space.ts platform，拓扑在 infra/deployment。
# 端口对应 infra/space.ts 的 local 模式：共享主库 5432。
# Caddy 默认把管理转到宿主机 8081（application.yml 的 PORT），阅读转到 8082。
# local 模式的 control 在 8091；使用该模式时设置 ADMIN_UPSTREAM=host.docker.internal:8091。
# 版本 pin 见 docs/tech/STACK.md。这里的口令和 init 脚本只属于本机。
name: document-space

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: space
      POSTGRES_USER: space
      POSTGRES_PASSWORD: space
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql # PG 18 镜像约定：挂载点在上层目录（数据落 18/docker 子目录）
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U space -d space"]
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.53
    environment:
      MEILI_MASTER_KEY: dev-master-key-change-me
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meilidata:/meili_data

  mailpit:
    image: axllent/mailpit:v1.31.0
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  minio:
    image: ${SPACE_OBJECT_IMAGE:-space-objectstore:2025-09-07}
    build: { context: ., dockerfile: infra/deployment/Dockerfile, target: objectstore }
    pull_policy: never
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: space
      MINIO_ROOT_PASSWORD: space-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init: # 建桶：attachments / bundles（幂等）
    image: ${SPACE_OBJECT_IMAGE:-space-objectstore:2025-09-07}
    pull_policy: never
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 space space-dev; do sleep 1; done;
      mc mb -p local/attachments local/bundles;
      exit 0"

  caddy:
    image: caddy:2
    environment:
      # ADR-0022：本地管理与阅读使用不同进程；各 upstream 可独立覆写。
      CONTENT_UPSTREAM: ${CONTENT_UPSTREAM:-host.docker.internal:8082}
      ADMIN_UPSTREAM: ${ADMIN_UPSTREAM:-host.docker.internal:8081}
    ports:
      - "8088:8088"
    volumes:
      - ./infra/deployment/local.Caddyfile:/etc/caddy/Caddyfile:ro
    # host.docker.internal 由 OrbStack/Docker Desktop 原生提供，勿用 extra_hosts 覆盖

volumes:
  pgdata:
  meilidata:
  miniodata:
